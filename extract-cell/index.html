<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>wikiru 表の列を抽出しclipboard関数に変換するツール</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="container">
      <h2>wikiru 表の列を抽出しclipboard関数に変換するツール</h2>

      <div>
        <p><strong>入力ボックス（記事ソース）</strong></p>
        <textarea
          id="input"
          rows="15"
          cols="100"
          placeholder="ここにwikiruの表ソースを貼り付けてください"
        ></textarea>
      </div>

      <div style="margin-top: 8px">
        <label style="margin-left: 8px">
          n番目の「|」:
          <input id="nIndex" type="number" value="1" min="1" />
        </label>
      </div>
      <div style="margin-top: 8px">
        <label style="margin-left: 8px">
          m番目の「|」:
          <input id="mIndex" type="number" value="2" min="1" />
        </label>
      </div>
      <div style="margin-top: 8px">
        <label style="margin-left: 8px">
          ソート基準列:
          <input id="sIndex" type="number" value="0" min="0" />
        </label>
      </div>
      <div style="margin-top: 8px">
        <label style="margin-left: 8px">
          列を改行して連結する:
          <input id="isConcat" type="checkbox" value="false" />
        </label>
      </div>

      <div style="margin-top: 8px">
        <label style="margin-left: 8px">
          列をスワップする:
          <input id="swapA" type="number" value="0" min="0" />
          <input id="swapB" type="number" value="0" min="0" />
        </label>
      </div>

      <div style="margin-top: 8px">
        <button onclick="run()">変換</button>
      </div>

      <div style="margin-top: 8px">
        <p><strong>出力ボックス</strong></p>
        <textarea id="output" rows="15" cols="100" readonly></textarea>
      </div>

      <script>
        function run() {
          const src = document.getElementById("input").value;
          const n = parseInt(document.getElementById("nIndex").value, 10);
          const m = parseInt(document.getElementById("mIndex").value, 10);
          const sortIndex = parseInt(
            document.getElementById("sIndex").value,
            10,
          );
          const isConcatColumns = document.getElementById("isConcat");
          const swapA = parseInt(document.getElementById("swapA").value, 10);
          const swapB = parseInt(document.getElementById("swapB").value, 10);

          const outLines = [];

          if (
            !Number.isInteger(n) ||
            !Number.isInteger(m) ||
            n < 1 ||
            m < 1 ||
            n > m
          ) {
            alert(
              "n, m は 1以上の整数で、n ≤ m になるように指定してください。",
            );
            return;
          }

          const lines = src.split("\n");
          const tableLines = [];

          // テーブルの形式を満たした行を取得
          for (const line of lines) {
            const trimmed = line.trim();

            // 行頭が "|" で始まるか
            if (!trimmed.startsWith("|")) continue;

            // 行末が h / c / f の場合は除外
            if (/[hcf]$/.test(trimmed)) continue;

            // "|" の位置を n番目〜m番目で扱うため、split で列を取得
            const parts = trimmed.split("|"); // 先頭の "|" の前は空文字になる
            const pipeCount = parts.length - 1; // "|" の数

            if (pipeCount < m) continue; // m番目の "|" が存在しない行はスキップ

            // 行をスタック
            tableLines.push(line);
          }

          // sortIndexが0の場合はソートしない
          if (sortIndex > 0) {
            // sortIndex番目の列を基準にtableLinesをソートする。
            tableLines.sort((a, b) => {
              const aParts = a.trim().split("|");
              const bParts = b.trim().split("|");

              const aValue = aParts[sortIndex] || "";
              const bValue = bParts[sortIndex] || "";

              return aValue.localeCompare(bValue);
            });
          }

          // "|"で区切られた列の中身をスワップする
          if (swapA > 0 && swapB > 0) {
            for (let i = 0; i < tableLines.length; i++) {
              const line = tableLines[i];
              const parts = line.trim().split("|");

              if (parts.length > Math.max(swapA, swapB)) {
                // スワップ
                const temp = parts[swapA];
                parts[swapA] = parts[swapB];
                parts[swapB] = temp;

                // 再構築してtableLinesを更新
                tableLines[i] = parts.join("|");
              }
            }
          }

          // tableLinesを走査し、clipboard関数に変換
          for (const line of tableLines) {
            const trimmed = line.trim();
            const parts = trimmed.split("|"); // 先頭の "|" の前は空文字になる
            // n番目〜m番目の "|" の間にあるテキストは parts[n]〜parts[m-1]
            let extracted = parts.slice(n, m).join("|").trim();

            if (extracted !== "") {
              if (!extracted.match(/ref/gm)) {
                continue;
              }

              const bgColor = extracted.match(/(BGCOLOR\(#[a-zA-Z0-9]+\):)/);
              if (bgColor) {
                extracted = extracted.replaceAll(bgColor[1], "");
                extracted = bgColor[1] + extracted;
              }

              if (isConcatColumns.checked) {
                extracted = extracted.replaceAll("|", "&br;");
              }

              outLines.push(`#clipboard(source){{\n|${extracted}|\n}}`);
            }
          }

          document.getElementById("output").value = outLines.join("\n");
        }
      </script>
    </div>
  </body>
</html>
